<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbo Diário - Liturgia Diária</title>
    <meta name="description" content="Verbo Diário: leituras da liturgia católica de todos os dias — 1ª Leitura, Salmo Responsorial, Evangelho e reflexão, com tipografia confortável e tema claro/escuro.">
    <meta property="og:title" content="Verbo Diário - Liturgia Diária">
    <meta property="og:description" content="Leituras da liturgia católica de todos os dias em tipografia confortável.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#f9f9f9">

    <!-- PWA & Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="selection:bg-primary selection:text-on-primary">

    <header class="app-header fixed top-0 left-0 right-0 z-[60] backdrop-blur-xl border-b" id="mainHeader">

                <div class="md:hidden flex items-center gap-2">
                    <button id="themeToggleMobile" class="p-2 rounded-full theme-hover transition-all" onclick="toggleTheme()" aria-label="Alternar tema claro/escuro">
                        <span class="material-symbols-outlined text-xl" id="themeIconMobile">dark_mode</span>
                    </button>
                    <button id="fontToggleMobile" class="p-2 rounded-full theme-hover transition-all" onclick="toggleFont()" aria-label="Alternar tamanho da fonte">
                        <span class="material-symbols-outlined text-xl">format_size</span>
                    </button>
                    <button onclick="openDateModal()" class="p-2 rounded-full theme-hover transition-all" title="Ver outro dia" aria-label="Ver outro dia">
                        <span class="material-symbols-outlined text-xl">calendar_month</span>

            <!-- Navigation Links - Separate row on mobile -->
            <nav class="flex items-center justify-center gap-6 md:gap-10 font-bold tracking-tight w-full md:w-auto border-t md:border-t-0 pt-3 md:pt-0 theme-border">
                <a href="#reading-1" class="hover:text-primary transition-colors text-xs md:text-base whitespace-nowrap">1ª Leitura</a>
                <a href="#psalm" class="hover:text-primary transition-colors text-xs md:text-base whitespace-nowrap">Salmo</a>
                <a href="#gospel" class="hover:text-primary transition-colors text-xs md:text-base whitespace-nowrap">Evangelho</a>

            <!-- Size control on desktop -->
            <div class="hidden md:flex items-center gap-3">
                <button id="themeToggleDesktop" class="p-3 rounded-full theme-hover transition-all flex items-center gap-2 text-sm font-bold" onclick="toggleTheme()" aria-label="Alternar tema claro/escuro">
                    <span class="material-symbols-outlined" id="themeIconDesktop">dark_mode</span>
                </button>
                <button id="fontToggleDesktop" class="p-3 rounded-full theme-hover transition-all flex items-center gap-2 text-sm font-bold" onclick="toggleFont()" aria-label="Alternar tamanho da fonte">
                    <span class="material-symbols-outlined">format_size</span>

                </button>

    <!-- Aviso para visitantes sem JavaScript (o esqueleto nunca é substituído sem JS) -->

            <h2 style="margin: 0 0 12px; font-size: 1.5rem;">JavaScript desativado</h2>
            <p style="margin: 0;">O Verbo Diário precisa de JavaScript para buscar as leituras da liturgia do dia. Ative o JavaScript no navegador e recarregue a página.</p>
        </div>

    <!-- Date Picker Modal -->
    <div id="dateModal" class="fixed inset-0 z-[200] flex items-end md:items-center justify-center bg-black/40 backdrop-blur-sm hidden" onclick="closeDateModal(event)" role="dialog" aria-modal="true" aria-labelledby="dateModalTitle">
        <div class="surface-panel rounded-t-3xl md:rounded-3xl p-8 md:p-12 w-full md:max-w-md shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-8">
                <h2 id="dateModalTitle" class="text-2xl font-black">Escolher Data</h2>
                <button onclick="closeDateModal()" class="p-2 rounded-full theme-hover transition-all" aria-label="Fechar">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <label for="dateInput" class="theme-muted text-sm font-bold uppercase tracking-widest mb-4 block">Selecione um dia</label>
            <input type="date" id="dateInput"

            <div class="flex gap-4 mt-8">

                    Hoje
                </button>
                <button onclick="goToDate()" class="btn-primary flex-1 py-4 rounded-full font-black hover:opacity-80 transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
                    Ver Leituras
                </button>
            </div>
        </div>
    </div>

    <!-- Banner: viewing another day -->
    <div id="dateBanner" class="hidden fixed top-0 left-0 right-0 z-[70] mt-[120px] md:mt-[72px]">
        <div class="bg-primary on-primary text-center py-3 px-6 flex items-center justify-center gap-4 text-sm font-bold">
            <span class="material-symbols-outlined text-sm">history</span>
            <span id="dateBannerText">Você está vendo uma data diferente de hoje.</span>
            <button onclick="goToToday()" class="underline hover:no-underline ml-4 whitespace-nowrap">Voltar ao Hoje</button>
        </div>
    </div>

    <aside class="app-sidebar hidden xl:flex flex-col h-screen w-80 fixed left-0 top-0 pt-32 pb-12 px-8 z-40 border-r">
        <div class="space-y-12">
            <div>
                <h3 class="theme-muted text-xs font-black uppercase tracking-[0.3em] mb-8">Arquivos Sagrados</h3>
                <nav class="space-y-4">
                    <a href="#gospel" class="surface-panel flex items-center gap-4 p-4 rounded-2xl shadow-sm text-primary font-bold">
                        <span class="material-symbols-outlined">auto_stories</span>
                        Evangelho de Hoje
                    </a>
                    <a href="#reflection" class="surface-panel flex items-center gap-4 p-4 rounded-2xl shadow-sm text-primary font-bold theme-hover transition-all">
                        <span class="material-symbols-outlined">favorite</span>
                        Reflexão do Dia
                    </a>
                </nav>
            </div>
        </div>
    </aside>

    <main class="xl:ml-80 pt-52 md:pt-40 pb-32 min-h-screen" id="appContent">
        <div class="max-w-4xl mx-auto px-6 space-y-20">
            <div class="app-skeleton h-64 animate-pulse rounded-[3rem]"></div>
        </div>
    </main>

    <footer class="app-footer xl:ml-80 py-20 px-8 border-t">
        <div class="max-w-4xl mx-auto flex flex-col items-center gap-12 text-center">
            <div class="text-2xl font-black tracking-tight">Verbo Diário</div>
            <p class="text-xs font-bold opacity-40 uppercase tracking-[0.2em]">© <span id="footerYear">2026</span> Verbo Diário. A Liturgia como Arte.</p>
        </div>
    </footer>

    <script>
        // Font size cycling: Normal → Grande → Muito Grande → Normal
        const fontSizes = [
            { label: 'A',  reading: '1.125rem', h1: '2.5rem', h2: '1.5rem' },
            { label: 'A+', reading: '1.4rem',   h1: '3rem',   h2: '1.875rem' },
            { label: 'A++',reading: '1.75rem',  h1: '3.5rem', h2: '2.25rem' },
        ];

        // --- Preferências persistentes ---
        const THEME_KEY = 'verbo.theme';
        const FONT_SIZE_KEY = 'verbo.font-size';
        const savedFontIndex = Number.parseInt(localStorage.getItem(FONT_SIZE_KEY), 10);
        let fontIndex = Number.isInteger(savedFontIndex) && savedFontIndex >= 0 && savedFontIndex < fontSizes.length
            ? savedFontIndex
            : 0;

        function applyTheme() {
            const dark = document.body.classList.contains('dark');
            const icon = document.getElementById('themeIconDesktop');
            const iconMobile = document.getElementById('themeIconMobile');
            const name = dark ? 'light_mode' : 'dark_mode';
            if (icon) icon.textContent = name;
            if (iconMobile) iconMobile.textContent = name;
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#1a1c1c' : '#f9f9f9');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem(THEME_KEY, document.body.classList.contains('dark') ? 'dark' : 'light');
            applyTheme();
        }

        function applyFont() {
            const f = fontSizes[fontIndex];
            document.documentElement.style.setProperty('--reading-font-size', f.reading);
            document.querySelectorAll('h1').forEach(el => el.style.fontSize = f.h1);
            document.querySelectorAll('h2').forEach(el => el.style.fontSize = f.h2);
            const label = document.getElementById('fontLabel');
            if (label) label.textContent = f.label;
        }

        function toggleFont() {
            fontIndex = (fontIndex + 1) % fontSizes.length;
            localStorage.setItem(FONT_SIZE_KEY, String(fontIndex));
            applyFont();
        }

        // --- Date Modal & Global App Instance ---
        let appInstance = null;

        // Guarda o elemento que abriu o modal para devolver o foco ao fechar (WCAG 2.4.3)
        let modalReturnFocus = null;

        function openDateModal() {
            const modal = document.getElementById('dateModal');
            const input = document.getElementById('dateInput');
            const todayStr = new Date().toLocaleDateString('en-CA'); // 'YYYY-MM-DD' in local time

            // Sincroniza o valor do input com a data atual ou a data em exibição
            if (appInstance && appInstance.currentDateStr) {
                input.value = appInstance.currentDateStr;
            } else if (!input.value) {
                input.value = todayStr;
            }

            modalReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
            modal.classList.remove('hidden');
            // Foco inicial no campo de data ao abrir o diálogo
            if (input) input.focus();
        }

        function closeDateModal(event) {
            // Fecha ao clicar fora, no botão fechar ou ao pressionar Esc (sem evento)
            if (event && event.target.id !== 'dateModal' && event.currentTarget.tagName !== 'BUTTON') return;
            document.getElementById('dateModal').classList.add('hidden');
            if (modalReturnFocus && typeof modalReturnFocus.focus === 'function') {
                modalReturnFocus.focus();
                modalReturnFocus = null;
            }
        }

        function goToDate() {
            const input = document.getElementById('dateInput');
            const val = input.value;
            if (!val) return;
            document.getElementById('dateModal').classList.add('hidden');
            if (appInstance) appInstance.loadDate(val, true);
        }

        function goToToday() {
            document.getElementById('dateModal').classList.add('hidden');
            if (appInstance) appInstance.loadDate(null, true);
        }

        function retryLoad() {
            if (appInstance) appInstance.loadDate(appInstance.currentDateStr, false);
        }

        // Escapa HTML antes de injetar conteúdo vindo da API
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const LITURGICAL_COLORS = {
            verde: '#16a34a',
            roxo: '#7c3aed',
            branco: '#cbd5e1',
            vermelho: '#dc2626',
            rosa: '#ec4899',
            dourado: '#d97706',
        };

        function getLiturgicalColor(color) {
            const label = String(color == null ? '' : color).trim();
            const key = label.toLocaleLowerCase('pt-BR');
            return LITURGICAL_COLORS[key] || '#64748b';
        }

        const REFLECTIONS_BASE_PATH = './data/reflexoes';

        function padDatePart(value) {
            return String(value).padStart(2, '0');
        }

        function resolveSelectedDateParts(dateStr) {
            if (dateStr) {
                const [year, month, day] = String(dateStr).split('-');
                return {
                    year,
                    month: padDatePart(month),
                    day: padDatePart(day),
                    iso: `${year}-${padDatePart(month)}-${padDatePart(day)}`,
                };
            }

            const today = new Date();
            const year = String(today.getFullYear());
            const month = padDatePart(today.getMonth() + 1);
            const day = padDatePart(today.getDate());
            return { year, month, day, iso: `${year}-${month}-${day}` };
        }

        function getReflectionMonthPath(month) {
            return `${REFLECTIONS_BASE_PATH}/${padDatePart(month)}.json`;
        }

        const Components = {
            // Converte "Naquele tempo, disse Jesus: 23“Ai de vós..." em blocos de versículos.
            // O texto anterior ao primeiro versículo (preâmbulo) é preservado, e o número
            // pode vir seguido de aspas — padrão da API para falas em discurso direto.
            parseVerses: (text) => {
                const source = String(text == null ? '' : text);

                // Aspas de abertura aceitas entre o número e a primeira letra maiúscula
                const OPENING_QUOTES = '\u201C\u201D"\u00AB\u2018\u0027';
                const UPPER = 'A-Z\u00C1\u00C0\u00C2\u00C3\u00C9\u00CA\u00CD\u00D3\u00D4\u00D5\u00DA\u00DC\u00C7';
                const LOWER = 'a-z\u00E1\u00E0\u00E2\u00E3\u00E9\u00EA\u00ED\u00F3\u00F4\u00F5\u00FA\u00FC\u00E7';
                const marker = new RegExp('(\\d{1,3})(?=[' + OPENING_QUOTES + ']?[' + UPPER + '])', 'g');

                // Versículos no meio da frase (iniciados por minúscula) viram marcadores inline
                const inlineMarker = new RegExp('(\\d{1,3})(?=[' + LOWER + '])', 'g');
                const formatInlineVerses = (str) => escapeHtml(str).replace(
                    inlineMarker,
                    '<span class="inline-block text-xs font-black text-secondary bg-surface-container-high px-1.5 py-0.5 rounded mx-1 align-baseline">$1</span> '
                );

                const verses = [];
                let cursor = 0;
                let match;

                while ((match = marker.exec(source)) !== null) {
                    const start = match.index;
                    // Ignora dígitos colados em palavras/números maiores (ex.: "2Ts", "1-11")
                    const before = start > 0 ? source[start - 1] : '';
                    if (before && /[\dA-Za-z\u00C0-\u017F]/.test(before)) continue;

                    // Tudo que antecede este versículo pertence ao bloco anterior
                    const chunk = source.slice(cursor, start).trim();
                    if (chunk) {
                        if (verses.length === 0) {
                            // Preâmbulo narrativo ("Naquele tempo, disse Jesus:")
                            verses.push({ num: '', content: formatInlineVerses(chunk) });
                        } else {
                            verses[verses.length - 1].content += ' ' + formatInlineVerses(chunk);
                        }
                    }

                    verses.push({ num: match[1], content: '' });
                    cursor = start + match[1].length;
                }

                // Resto do texto após o último marcador
                const tail = source.slice(cursor).trim();
                if (tail) {
                    if (verses.length === 0) {
                        verses.push({ num: '', content: formatInlineVerses(tail) });
                    } else {
                        verses[verses.length - 1].content += formatInlineVerses(tail);
                    }
                }

                return verses
                    .map(v => ({ num: v.num, content: v.content.trim() }))
                    .filter(v => v.content);
            },

            ReadingCard: (title, reference, text, id = "") => {
                const verses = Components.parseVerses(text);
                const versesHtml = verses.map(v => `
                    <div class="flex gap-0 mb-10 items-start">
                        <div class="flex-shrink-0 w-12 md:w-16 text-right pr-4 md:pr-6 verse-divider border-r-2 mr-5 md:mr-8 pt-1">
                            <span class="verse-number text-sm md:text-base font-black select-none leading-relaxed">${v.num}</span>
                        </div>
                        <p class="reading-paragraph flex-1 text-xl md:text-2xl font-medium leading-relaxed">${v.content}</p>
                    </div>
                `).join('');
                return `
                <section class="max-w-4xl mx-auto mb-24 px-6" id="${id}">
                    <div class="mb-12">
                        <span class="text-secondary uppercase tracking-widest text-xs font-bold mb-2 block">Leitura do Dia</span>
                        <h2 class="text-4xl md:text-6xl font-black text-on-surface tracking-tight leading-tight">
                            ${escapeHtml(title)} <br/>
                            <span class="text-secondary text-2xl md:text-4xl">(${escapeHtml(reference)})</span>
                        </h2>
                    </div>
                    <article class="relative bg-surface-container-lowest rounded-3xl p-10 md:p-20 shadow-sm overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary opacity-20"></div>
                        <div class="reading-text">
                            ${versesHtml}
                            <div class="mt-16 pt-8 border-t border-surface-container">
                                <p class="text-lg font-bold text-secondary">— Palavra do Senhor.</p>
                                <p class="text-lg font-black text-primary mt-1 uppercase tracking-wider">— Graças a Deus.</p>
                            </div>
                        </div>
                    </article>
                </section>
            `},
            PsalmSection: (reference, refrain, texto) => {
                // A API separa as estrofes por quebra de linha e/ou travessão.
                // Aceita EN DASH (–, U+2013), EM DASH (—, U+2014) e hífen.
                const parts = String(texto == null ? '' : texto)
                    .split(/\r?\n|(?=[\u2013\u2014-]\s)/)
                    .map(chunk => chunk.trim()
                        .replace(/^[\u2013\u2014-]\s*/, '')  // remove o travessão inicial
                        .replace(/^\d+\s*/, '')              // remove numeração de estrofe
                        .trim())
                    .filter(Boolean)
                    .map(clean => '\u2014 ' + clean);

                const refraoCompact = `
                    <div class="flex items-center justify-center text-center py-3 px-6 bg-surface-container-low/60 rounded-lg border-l-4 border-primary max-w-2xl mx-auto mb-8 mt-2">
                        <p class="text-base md:text-lg font-bold text-primary leading-snug italic">${escapeHtml(refrain)}</p>
                    </div>
                `;

                // Build: big refrain → strophe[0] → compact refrain → strophe[1] → compact refrain...
                let strophesHtml = '';
                parts.forEach((strophe, i) => {
                    if (i > 0) strophesHtml += refraoCompact;
                    strophesHtml += `
                        <div class="max-w-2xl mx-auto mb-10 pl-2">
                            <p class="reading-paragraph text-xl md:text-2xl leading-relaxed">${escapeHtml(strophe)}</p>
                        </div>
                    `;
                });
                // Final refrain at the end
                strophesHtml += refraoCompact;

                return `
                <section class="max-w-4xl mx-auto mb-24 px-6" id="psalm">
                    <div class="mb-12">
                        <span class="text-secondary uppercase tracking-widest text-xs font-bold mb-2 block">Salmo Responsorial</span>
                        <h2 class="text-4xl md:text-6xl font-black text-on-surface tracking-tight leading-tight">${escapeHtml(reference)}</h2>
                    </div>
                    <div class="bg-surface-container-lowest p-8 md:p-16 rounded-3xl shadow-sm">
                        <!-- Refrão principal (início) -->
                        <div class="flex flex-col items-center justify-center text-center py-12 px-8 bg-surface-container-low rounded-2xl border-l-[8px] border-primary mb-12">
                            <span class="text-secondary font-bold text-xs tracking-[0.3em] mb-6">— REFRÃO —</span>
                            <p class="text-2xl md:text-4xl font-extrabold text-primary">${escapeHtml(refrain)}</p>
                        </div>
                        ${strophesHtml}
                    </div>
                </section>
            `},
            HomilySection: (title, author, content) => {
                const paragraphs = Array.isArray(content)
                    ? content
                    : String(content == null ? '' : content).split('\n');
                const safeAuthor = String(author == null ? '' : author).trim();
                return `
                <section class="max-w-4xl mx-auto mb-24 px-6" id="reflection">
                    <div class="mb-12">
                        <span class="text-secondary uppercase tracking-widest text-xs font-bold mb-2 block">Reflexão do Dia</span>
                        <h2 class="text-4xl md:text-6xl font-black text-on-surface tracking-tight leading-tight">${escapeHtml(title)}</h2>
                        ${safeAuthor ? `<p class="theme-muted text-sm md:text-base font-bold mt-4">${escapeHtml(safeAuthor)}</p>` : ''}
                    </div>
                    <article class="bg-surface-container-lowest p-8 md:p-20 rounded-[3rem] shadow-sm reading-text">
                        ${paragraphs.map(p => p.trim() ? `<p class="reading-paragraph mb-10 text-xl md:text-2xl">${escapeHtml(p.trim())}</p>` : '').join('')}
                    </article>
                </section>
            `},
            DailyInfo: (date, color) => {
                const colorLabel = String(color == null ? 'Desconhecida' : color).trim() || 'Desconhecida';
                return `
                <div class="flex flex-col">
                    <span class="text-2xl font-black text-primary tracking-tight">Verbo Diário</span>
                    <div class="flex items-center gap-4 mt-1">
                        <span class="text-xs uppercase tracking-[0.2em] font-bold text-secondary">${escapeHtml(date)}</span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high text-[10px] font-bold uppercase tracking-widest border">
                            <span class="w-2 h-2 rounded-full" style="background-color: ${getLiturgicalColor(colorLabel)}"></span>
                            Cor: ${escapeHtml(colorLabel)}
                        </span>
                    </div>
                </div>
            `}
        };

        class App {
            constructor() {
                this.appContent = document.getElementById('appContent');
                this.dailyInfoContainer = document.getElementById('dailyInfoContainer');
                this.scrollIndicator = document.getElementById('scrollIndicator');
                this.header = document.getElementById('mainHeader');
                this.dateBanner = document.getElementById('dateBanner');
                this.currentDateStr = null; // null means 'today'
                this.reflectionsCache = new Map();
                this.init();
            }

            async init() {
                if (localStorage.getItem(THEME_KEY) === 'dark') {
                    document.body.classList.add('dark');
                }
                applyTheme();
                applyFont();
                window.addEventListener('scroll', () => this.handleScroll(), { passive: true });
                document.addEventListener('keydown', (e) => this.handleKeydown(e));
                window.addEventListener('popstate', () => this.handlePopState());

                const yearEl = document.getElementById('footerYear');
                if (yearEl) yearEl.textContent = String(new Date().getFullYear());
                appInstance = this;

                // Lê data a partir da query string da URL (?data=YYYY-MM-DD)
                const urlParams = new URLSearchParams(window.location.search);
                const dateParam = urlParams.get('data');
                const validDatePattern = /^\d{4}-\d{2}-\d{2}$/;
                const initialDate = dateParam && validDatePattern.test(dateParam) ? dateParam : null;

                await this.loadDate(initialDate, false);
            }

            // Teclado no modal: Esc fecha e Tab/Shift+Tab ficam contidos nele (WCAG 2.1.2)
            handleKeydown(e) {
                const modal = document.getElementById('dateModal');
                if (!modal || modal.classList.contains('hidden')) return;

                if (e.key === 'Escape') {
                    e.preventDefault();
                    closeDateModal();
                    return;
                }

                if (e.key === 'Tab') {
                    const focusables = modal.querySelectorAll('button, input');
                    if (!focusables.length) return;
                    const first = focusables[0];
                    const last = focusables[focusables.length - 1];
                    if (e.shiftKey && document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            }

            handlePopState() {
                const urlParams = new URLSearchParams(window.location.search);
                const dateParam = urlParams.get('data');
                const validDatePattern = /^\d{4}-\d{2}-\d{2}$/;
                const targetDate = dateParam && validDatePattern.test(dateParam) ? dateParam : null;
                this.loadDate(targetDate, false);
            }

            updateUrlState(dateStr) {
                if (!window.history || typeof window.history.pushState !== 'function') return;
                const currentUrl = new URL(window.location.href);
                const currentParam = currentUrl.searchParams.get('data');

                if (dateStr) {
                    if (currentParam !== dateStr) {
                        currentUrl.searchParams.set('data', dateStr);
                        window.history.pushState({ data: dateStr }, '', currentUrl);
                    }
                } else {
                    if (currentParam) {
                        currentUrl.searchParams.delete('data');
                        window.history.pushState({ data: null }, '', currentUrl);
                    }
                }
            }

            async loadDate(dateStr, updateUrl = false) {
                // dateStr formats expected as "YYYY-MM-DD"
                this.currentDateStr = dateStr;

                // Show Banner if not today
                const todayStr = new Date().toLocaleDateString('en-CA');
                if (dateStr && dateStr !== todayStr) {
                    this.dateBanner.classList.remove('hidden');
                    if (updateUrl) this.updateUrlState(dateStr);
                } else {
                    this.dateBanner.classList.add('hidden');
                    this.currentDateStr = null; // Treat 'today' date as null to use default endpoint
                    if (updateUrl) this.updateUrlState(null);
                }

                // Show loaders
                this.appContent.innerHTML = `
                    <div class="max-w-4xl mx-auto px-6 space-y-20">
                        <div class="app-skeleton h-40 animate-pulse rounded-[3rem]"></div>
                        <div class="app-skeleton h-96 animate-pulse rounded-[3rem]"></div>
                    </div>
                `;

                // Fetch
                await this.fetchData();
            }

            async loadReflectionMonth(month) {
                const monthKey = padDatePart(month);
                if (this.reflectionsCache.has(monthKey)) {
                    return this.reflectionsCache.get(monthKey);
                }

                const response = await fetch(getReflectionMonthPath(monthKey));
                if (!response.ok) {
                    throw new Error(`Arquivo de reflexões indisponível para o mês ${monthKey}.`);
                }

                const payload = await response.json();
                const days = payload && typeof payload.days === 'object' ? payload.days : {};
                this.reflectionsCache.set(monthKey, days);
                return days;
            }

            async getReflectionForSelectedDate() {
                const { month, day } = resolveSelectedDateParts(this.currentDateStr);
                try {
                    const monthEntries = await this.loadReflectionMonth(month);
                    return monthEntries[day] || null;
                } catch (error) {
                    console.warn('Reflection Load Error:', error);
                    return null;
                }
            }

            async fetchData() {
                let url = 'https://liturgia.up.railway.app/';
                if (this.currentDateStr) {
                    const [year, month, day] = this.currentDateStr.split('-');
                    url += `${day}-${month}-${year}`; // API exige DD-MM-YYYY
                }

                let data;
                try {
                    // Timeout evita esqueleto de carregamento infinito se a API travar
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 8000);
                    let res;
                    try {
                        res = await fetch(url, { signal: controller.signal });
                    } finally {
                        clearTimeout(timer);
                    }

                    if (!res.ok) throw new Error('A API respondeu com status ' + res.status);

                    data = await res.json();
                    if (!data || typeof data !== 'object') throw new Error('Resposta da API em formato inesperado.');
                } catch (e) {
                    console.error('Fetch Error:', e);
                    // Nunca inventar leituras: mostrar erro honesto com opção de tentar de novo
                    this.renderError(e);
                    return;
                }

                let reflection = null;
                try {
                    reflection = await this.getReflectionForSelectedDate();
                    this.render(data, reflection);
                } catch (err) {
                    console.error('Render Error:', err);
                    this.renderError(err);
                }
            }

            renderError(error) {
                const isAbort = error && error.name === 'AbortError';
                const detalhe = isAbort
                    ? 'A conexão demorou demais para responder.'
                    : 'Não foi possível falar com o servidor da liturgia.';
                const diaLabel = this.currentDateStr
                    ? this.currentDateStr.split('-').reverse().join('/')
                    : 'de hoje';

                this.dailyInfoContainer.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-xl md:text-2xl font-black text-primary tracking-tight">Verbo Diário</span>
                        <span class="text-[10px] md:text-xs uppercase tracking-[0.2em] font-bold text-secondary">Sem conexão</span>
                    </div>
                `;

                this.appContent.innerHTML = `
                    <section class="max-w-2xl mx-auto px-6 text-center" role="alert">
                        <div class="surface-panel rounded-3xl p-10 md:p-16 shadow-sm">
                            <span class="material-symbols-outlined text-5xl text-secondary mb-6 block">cloud_off</span>
                            <h2 class="text-3xl md:text-4xl font-black mb-4">Não foi possível carregar a liturgia ${escapeHtml(diaLabel)}</h2>
                            <p class="text-base md:text-lg text-secondary mb-10">${escapeHtml(detalhe)} Verifique sua conexão e tente novamente.</p>
                            <button onclick="retryLoad()" class="btn-primary inline-flex items-center gap-2 hover:opacity-80 transition-all">
                                <span class="material-symbols-outlined">refresh</span>
                                Tentar novamente
                            </button>
                        </div>
                    </section>
                `;
            }

            handleScroll() {
                if (!this.scrollIndicator) return;
                const winScroll = document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                // Página mais curta que a viewport: divisão por zero geraria "NaN%"
                if (height <= 0) {
                    this.scrollIndicator.style.height = "0%";
                    return;
                }
                this.scrollIndicator.style.height = Math.min(100, (winScroll / height) * 100) + "%";
            }

            render(data, reflection) {
                this.dailyInfoContainer.innerHTML = Components.DailyInfo(data.data || "Hoje", data.cor || "Verde");
                let html = '';
                if (data.primeiraLeitura && typeof data.primeiraLeitura === 'object') {
                    html += Components.ReadingCard("1ª Leitura", data.primeiraLeitura.referencia, data.primeiraLeitura.texto, "reading-1");
                }
                if (data.segundaLeitura && typeof data.segundaLeitura === 'object') {
                    html += Components.ReadingCard("2ª Leitura", data.segundaLeitura.referencia, data.segundaLeitura.texto, "reading-2");
                }
                if (data.salmo && typeof data.salmo === 'object') {
                    html += Components.PsalmSection(data.salmo.referencia, data.salmo.refrao, data.salmo.texto);
                }
                if (data.evangelho && typeof data.evangelho === 'object') {
                    html += Components.ReadingCard("Evangelho", data.evangelho.referencia, data.evangelho.texto, "gospel");
                }
                if (reflection && typeof reflection === 'object') {
                    html += Components.HomilySection(
                        reflection.title || 'Reflexão do Dia',
                        reflection.author || '',
                        reflection.content || []
                    );
                }
                this.appContent.innerHTML = html;

                // Mantém tamanho de fonte e tema atuais após re-render
                applyFont();
            }
        }

        // --- Registro do Service Worker (Offline & PWA) ---
        if ('serviceWorker' in navigator && (window.location.protocol.startsWith('http') || window.location.protocol === 'file:')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => {
                    console.warn('Service Worker registration failed:', err);
                });
            });
        }

        // --- Inicialização do app ---
        // DOMContentLoaded em vez de window.onload: o fetch da liturgia começa
        // sem esperar fontes terminarem de carregar.
        function startApp() {
            new App();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', startApp);
        } else {
            startApp();
        }
    </script>
</body>
</html>
