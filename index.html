<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbo Diário - Liturgia Diária</title>
    <meta name="description" content="Verbo Diário: leituras da liturgia católica de todos os dias — 1ª Leitura, Salmo Responsorial, Evangelho e reflexão, com tipografia confortável e tema claro/escuro.">
    <meta property="og:title" content="Verbo Diário - Liturgia Diária">
    <meta property="og:description" content="Leituras da liturgia católica de todos os dias em tipografia confortável.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap');

        :root {
            --primary: #000000;
            --primary-container: #3b3b3b;
            --on-primary: #e2e2e2;
            --surface: #f9f9f9;
            --surface-container-lowest: #ffffff;
            --surface-container-low: #f3f3f4;
            --surface-container: #eeeeee;
            --surface-container-high: #e8e8e8;
            --surface-container-highest: #e2e2e2;
            --on-surface: #1a1c1c;
            --secondary: #5f5e5e;
            --tertiary: #3b3b3c;
            --font-lexend: 'Lexend', sans-serif;
            --reading-font-size: 1.25rem;
            --line-height-multiplier: 1.6;
            --tracking: 0.02em;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark {
            --primary: #ffffff;
            --on-primary: #1a1c1c;
            --surface: #1a1c1c;
            --surface-container-lowest: #000000;
            --on-surface: #f0f1f1;
        }

        body {
            font-family: var(--font-lexend);
            background-color: var(--surface);
            color: var(--on-surface);
            line-height: var(--line-height-multiplier);
            letter-spacing: var(--tracking);
            overflow-x: hidden;
        }

        .liturgical-scroll-indicator {
            position: fixed;
            left: 0;
            top: 0;
            width: 6px;
            height: 0%;
            background-color: var(--primary);
            z-index: 100;
            transition: height 0.1s ease-out;
        }

        h1 { font-size: 3.5rem; font-weight: 800; line-height: 1.1; }
        h2 { font-size: 1.75rem; font-weight: 700; }
        .reading-text { font-size: var(--reading-font-size); max-width: 800px; margin: 0 auto; }
        
        .btn-primary {
            background-color: var(--primary);
            color: var(--on-primary);
            border-radius: 0.75rem;
            padding: 1rem 2rem;
            font-weight: 700;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { background: var(--surface-container-high); border-radius: 10px; }

        /* Scroll margin for fixed header - larger on mobile for 2-row header */
        section[id] {
            scroll-margin-top: 180px;
        }
        @media (min-width: 768px) {
            section[id] {
                scroll-margin-top: 120px;
            }
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: 'var(--surface)',
                        'on-surface': 'var(--on-surface)',
                        primary: 'var(--primary)',
                        secondary: 'var(--secondary)',
                        'surface-container-low': 'var(--surface-container-low)',
                        'surface-container-high': 'var(--surface-container-high)',
                        'surface-container-lowest': 'var(--surface-container-lowest)',
                        'surface-container-highest': 'var(--surface-container-highest)',
                    }
                }
            }
        }
    </script>
</head>
<body class="selection:bg-primary selection:text-white">
    <div id="scrollIndicator" class="liturgical-scroll-indicator"></div>

    <header class="fixed top-0 left-0 right-0 z-[60] bg-white/90 backdrop-blur-xl border-b border-gray-100" id="mainHeader">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <!-- Logo area -->
            <div class="flex justify-between items-center w-full md:w-auto">
                <div id="dailyInfoContainer">
                    <div class="flex flex-col">
                        <span class="text-xl md:text-2xl font-black text-primary tracking-tight">Verbo Diário</span>
                        <span class="text-[10px] md:text-xs uppercase tracking-[0.2em] font-bold text-gray-400">Carregando...</span>
                    </div>
                </div>
                <div class="md:hidden flex items-center gap-2">
                    <button id="themeToggleMobile" class="p-2 rounded-full hover:bg-gray-100 transition-all" onclick="toggleTheme()" aria-label="Alternar tema claro/escuro">
                        <span class="material-symbols-outlined text-xl" id="themeIconMobile">dark_mode</span>
                    </button>
                    <button id="fontToggleMobile" class="p-2 rounded-full hover:bg-gray-100 transition-all" onclick="toggleFont()" aria-label="Alternar tamanho da fonte">
                        <span class="material-symbols-outlined text-xl">format_size</span>
                    </button>
                    <button onclick="openDateModal()" class="p-2 rounded-full hover:bg-gray-100 transition-all">
                        <span class="material-symbols-outlined text-xl">calendar_month</span>
                    </button>
                </div>
            </div>

            <!-- Navigation Links - Separate row on mobile -->
            <nav class="flex items-center justify-center gap-6 md:gap-10 font-bold tracking-tight w-full md:w-auto border-t md:border-t-0 pt-3 md:pt-0 border-gray-50">
                <a href="#reading-1" class="hover:text-primary transition-colors text-xs md:text-base whitespace-nowrap">1ª Leitura</a>
                <a href="#psalm" class="hover:text-primary transition-colors text-xs md:text-base whitespace-nowrap">Salmo</a>
                <a href="#gospel" class="hover:text-primary transition-colors text-xs md:text-base whitespace-nowrap">Evangelho</a>
            </nav>

            <!-- Size control on desktop -->
            <div class="hidden md:flex items-center gap-3">
                <button id="themeToggleDesktop" class="p-3 rounded-full hover:bg-gray-100 transition-all flex items-center gap-2 text-sm font-bold" onclick="toggleTheme()" aria-label="Alternar tema claro/escuro">
                    <span class="material-symbols-outlined" id="themeIconDesktop">dark_mode</span>
                </button>
                <button id="fontToggleDesktop" class="p-3 rounded-full hover:bg-gray-100 transition-all flex items-center gap-2 text-sm font-bold" onclick="toggleFont()" aria-label="Alternar tamanho da fonte">
                    <span class="material-symbols-outlined">format_size</span>
                    <span id="fontLabel">A</span>
                </button>
                <button onclick="openDateModal()" class="p-3 rounded-full hover:bg-gray-100 transition-all" title="Ver outro dia" aria-label="Ver outro dia">
                    <span class="material-symbols-outlined">calendar_month</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Date Picker Modal -->
    <div id="dateModal" class="fixed inset-0 z-[200] flex items-end md:items-center justify-center bg-black/40 backdrop-blur-sm hidden" onclick="closeDateModal(event)">
        <div class="bg-white rounded-t-3xl md:rounded-3xl p-8 md:p-12 w-full md:max-w-md shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black">Escolher Data</h2>
                <button onclick="closeDateModal()" class="p-2 rounded-full hover:bg-gray-100">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <p class="text-sm text-gray-400 font-bold uppercase tracking-widest mb-4">Selecione um dia</p>
            <input type="date" id="dateInput"
                class="w-full text-xl font-bold p-4 rounded-2xl border-2 border-gray-100 focus:border-primary focus:outline-none transition-all" />
            <div class="flex gap-4 mt-8">
                <button onclick="goToToday()" class="flex-1 py-4 rounded-full border-2 border-gray-200 font-bold hover:bg-gray-50 transition-all">
                    Hoje
                </button>
                <button onclick="goToDate()" class="flex-1 py-4 rounded-full bg-primary text-white font-black hover:opacity-80 transition-all flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-xl">arrow_forward</span>
                    Ver Leituras
                </button>
            </div>
        </div>
    </div>

    <!-- Banner: viewing another day -->
    <div id="dateBanner" class="hidden fixed top-0 left-0 right-0 z-[70] mt-[120px] md:mt-[72px]">
        <div class="bg-primary text-white text-center py-3 px-6 flex items-center justify-center gap-4 text-sm font-bold">
            <span class="material-symbols-outlined text-sm">history</span>
            <span id="dateBannerText">Você está vendo uma data diferente de hoje.</span>
            <button onclick="goToToday()" class="underline hover:no-underline ml-4 whitespace-nowrap">Voltar ao Hoje</button>
        </div>
    </div>

    <aside class="hidden xl:flex flex-col h-screen w-80 fixed left-0 top-0 pt-32 pb-12 px-8 bg-gray-50/50 z-40 border-r border-gray-100">
        <div class="space-y-12">
            <div>
                <h3 class="text-xs font-black uppercase tracking-[0.3em] text-gray-400 mb-8">Arquivos Sagrados</h3>
                <nav class="space-y-4">
                    <a href="#" class="flex items-center gap-4 p-4 rounded-2xl bg-white shadow-sm text-primary font-bold">
                        <span class="material-symbols-outlined">auto_stories</span>
                        Evangelho de Hoje
                    </a>
                </nav>
            </div>
        </div>
    </aside>

    <main class="xl:ml-80 pt-52 md:pt-40 pb-32 min-h-screen" id="appContent">
        <div class="max-w-4xl mx-auto px-6 space-y-20">
            <div class="h-64 bg-gray-100 animate-pulse rounded-[3rem]"></div>
        </div>
    </main>

    <footer class="xl:ml-80 bg-gray-50 py-20 px-8 border-t border-gray-100">
        <div class="max-w-4xl mx-auto flex flex-col items-center gap-12 text-center">
            <div class="text-2xl font-black tracking-tight">Verbo Diário</div>
            <p class="text-xs font-bold opacity-40 uppercase tracking-[0.2em]">© 2026 Verbo Diário. A Liturgia como Arte.</p>
        </div>
    </footer>

    <script>
        // Font size cycling: Normal → Grande → Muito Grande → Normal
        const fontSizes = [
            { label: 'A',  reading: '1.125rem', h1: '2.5rem', h2: '1.5rem' },
            { label: 'A+', reading: '1.4rem',   h1: '3rem',   h2: '1.875rem' },
            { label: 'A++',reading: '1.75rem',  h1: '3.5rem', h2: '2.25rem' },
        ];
        let fontIndex = 0;

        // --- Theme (claro/escuro) ---
        const THEME_KEY = 'verbo.theme';

        function applyTheme() {
            const dark = document.body.classList.contains('dark');
            const icon = document.getElementById('themeIconDesktop');
            const iconMobile = document.getElementById('themeIconMobile');
            const name = dark ? 'light_mode' : 'dark_mode';
            if (icon) icon.textContent = name;
            if (iconMobile) iconMobile.textContent = name;
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', dark ? '#1a1c1c' : '#ffffff');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem(THEME_KEY, document.body.classList.contains('dark') ? 'dark' : 'light');
            applyTheme();
        }

        function applyFont() {
            const f = fontSizes[fontIndex];
            document.documentElement.style.setProperty('--reading-font-size', f.reading);
            document.querySelectorAll('h1').forEach(el => el.style.fontSize = f.h1);
            document.querySelectorAll('h2').forEach(el => el.style.fontSize = f.h2);
            document.querySelectorAll('.reading-text p, section p').forEach(el => {
                el.style.fontSize = f.reading;
            });
            const label = document.getElementById('fontLabel');
            if (label) label.textContent = f.label;
        }

        function toggleFont() {
            fontIndex = (fontIndex + 1) % fontSizes.length;
            applyFont();
        }

        // --- Date Modal & Global App Instance ---
        let appInstance = null;

        function openDateModal() {
            const modal = document.getElementById('dateModal');
            const input = document.getElementById('dateInput');
            const todayStr = new Date().toLocaleDateString('en-CA'); // 'YYYY-MM-DD' in local time
            
            // Allow future dates by not setting input.max
            if (!input.value) input.value = todayStr;
            modal.classList.remove('hidden');
        }

        function closeDateModal(event) {
            // Close if clicking outside or on the close button
            if (!event || event.target.id === 'dateModal' || event.currentTarget.tagName === 'BUTTON') {
                document.getElementById('dateModal').classList.add('hidden');
            }
        }

        function goToDate() {
            const input = document.getElementById('dateInput');
            const val = input.value;
            if (!val) return;
            document.getElementById('dateModal').classList.add('hidden');
            if (appInstance) appInstance.loadDate(val);
        }

        function goToToday() {
            document.getElementById('dateModal').classList.add('hidden');
            if (appInstance) appInstance.loadDate(null);
        }

        function retryLoad() {
            if (appInstance) appInstance.loadDate(appInstance.currentDateStr);
        }

        // Escapa HTML antes de injetar conteúdo vindo da API
        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        const Components = {
            // Converte "Naquele tempo, disse Jesus: 23“Ai de vós..." em blocos de versículos.
            // O texto anterior ao primeiro versículo (preâmbulo) é preservado, e o número
            // pode vir seguido de aspas — padrão da API para falas em discurso direto.
            parseVerses: (text) => {
                const source = String(text == null ? '' : text);

                // Aspas de abertura aceitas entre o número e a primeira letra maiúscula
                const OPENING_QUOTES = '\u201C\u201D"\u00AB\u2018\u0027';
                const UPPER = 'A-Z\u00C1\u00C0\u00C2\u00C3\u00C9\u00CA\u00CD\u00D3\u00D4\u00D5\u00DA\u00DC\u00C7';
                const LOWER = 'a-z\u00E1\u00E0\u00E2\u00E3\u00E9\u00EA\u00ED\u00F3\u00F4\u00F5\u00FA\u00FC\u00E7';
                const marker = new RegExp('(\\d{1,3})(?=[' + OPENING_QUOTES + ']?[' + UPPER + '])', 'g');

                // Versículos no meio da frase (iniciados por minúscula) viram marcadores inline
                const inlineMarker = new RegExp('(\\d{1,3})(?=[' + LOWER + '])', 'g');
                const formatInlineVerses = (str) => escapeHtml(str).replace(
                    inlineMarker,
                    '<span class="inline-block text-xs font-black text-secondary bg-surface-container-high px-1.5 py-0.5 rounded mx-1 align-baseline">$1</span> '
                );

                const verses = [];
                let cursor = 0;
                let match;

                while ((match = marker.exec(source)) !== null) {
                    const start = match.index;
                    // Ignora dígitos colados em palavras/números maiores (ex.: "2Ts", "1-11")
                    const before = start > 0 ? source[start - 1] : '';
                    if (before && /[\dA-Za-z\u00C0-\u017F]/.test(before)) continue;

                    // Tudo que antecede este versículo pertence ao bloco anterior
                    const chunk = source.slice(cursor, start).trim();
                    if (chunk) {
                        if (verses.length === 0) {
                            // Preâmbulo narrativo ("Naquele tempo, disse Jesus:")
                            verses.push({ num: '', content: formatInlineVerses(chunk) });
                        } else {
                            verses[verses.length - 1].content += ' ' + formatInlineVerses(chunk);
                        }
                    }

                    verses.push({ num: match[1], content: '' });
                    cursor = start + match[1].length;
                }

                // Resto do texto após o último marcador
                const tail = source.slice(cursor).trim();
                if (tail) {
                    if (verses.length === 0) {
                        verses.push({ num: '', content: formatInlineVerses(tail) });
                    } else {
                        verses[verses.length - 1].content += formatInlineVerses(tail);
                    }
                }

                return verses
                    .map(v => ({ num: v.num, content: v.content.trim() }))
                    .filter(v => v.content);
            },

            ReadingCard: (title, reference, text, id = "") => {
                const verses = Components.parseVerses(text);
                const versesHtml = verses.map(v => `
                    <div class="flex gap-0 mb-10 items-start">
                        <div class="flex-shrink-0 w-12 md:w-16 text-right pr-4 md:pr-6 border-r-2 border-gray-200 mr-5 md:mr-8 pt-1">
                            <span class="text-sm md:text-base font-black text-gray-300 select-none leading-relaxed">${v.num}</span>
                        </div>
                        <p class="flex-1 text-xl md:text-2xl font-medium leading-relaxed">${v.content}</p>
                    </div>
                `).join('');
                return `
                <section class="max-w-4xl mx-auto mb-24 px-6" id="${id}">
                    <div class="mb-12">
                        <span class="text-secondary uppercase tracking-widest text-xs font-bold mb-2 block">Leitura do Dia</span>
                        <h2 class="text-4xl md:text-6xl font-black text-on-surface tracking-tight leading-tight">
                            ${escapeHtml(title)} <br/>
                            <span class="text-secondary text-2xl md:text-4xl">(${escapeHtml(reference)})</span>
                        </h2>
                    </div>
                    <article class="relative bg-surface-container-lowest rounded-3xl p-10 md:p-20 shadow-sm overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary opacity-20"></div>
                        <div class="reading-text">
                            ${versesHtml}
                            <div class="mt-16 pt-8 border-t border-surface-container">
                                <p class="text-lg font-bold text-secondary">— Palavra do Senhor.</p>
                                <p class="text-lg font-black text-primary mt-1 uppercase tracking-wider">— Graças a Deus.</p>
                            </div>
                        </div>
                    </article>
                </section>
            `},
            PsalmSection: (reference, refrain, texto) => {
                // A API separa as estrofes por quebra de linha e/ou travessão.
                // Aceita EN DASH (–, U+2013), EM DASH (—, U+2014) e hífen.
                const parts = String(texto == null ? '' : texto)
                    .split(/\r?\n|(?=[\u2013\u2014-]\s)/)
                    .map(chunk => chunk.trim()
                        .replace(/^[\u2013\u2014-]\s*/, '')  // remove o travessão inicial
                        .replace(/^\d+\s*/, '')              // remove numeração de estrofe
                        .trim())
                    .filter(Boolean)
                    .map(clean => '\u2014 ' + clean);

                const refraoCompact = `
                    <div class="flex items-center justify-center text-center py-3 px-6 bg-surface-container-low/60 rounded-lg border-l-4 border-primary max-w-2xl mx-auto mb-8 mt-2">
                        <p class="text-base md:text-lg font-bold text-primary leading-snug italic">${escapeHtml(refrain)}</p>
                    </div>
                `;

                // Build: big refrain → strophe[0] → compact refrain → strophe[1] → compact refrain...
                let strophesHtml = '';
                parts.forEach((strophe, i) => {
                    if (i > 0) strophesHtml += refraoCompact;
                    strophesHtml += `
                        <div class="max-w-2xl mx-auto mb-10 pl-2">
                            <p class="text-xl md:text-2xl leading-relaxed">${escapeHtml(strophe)}</p>
                        </div>
                    `;
                });
                // Final refrain at the end
                strophesHtml += refraoCompact;

                return `
                <section class="max-w-4xl mx-auto mb-24 px-6" id="psalm">
                    <div class="mb-12">
                        <span class="text-secondary uppercase tracking-widest text-xs font-bold mb-2 block">Salmo Responsorial</span>
                        <h2 class="text-4xl md:text-6xl font-black text-on-surface tracking-tight leading-tight">${escapeHtml(reference)}</h2>
                    </div>
                    <div class="bg-surface-container-lowest p-8 md:p-16 rounded-3xl shadow-sm">
                        <!-- Refrão principal (início) -->
                        <div class="flex flex-col items-center justify-center text-center py-12 px-8 bg-surface-container-low rounded-2xl border-l-[8px] border-primary mb-12">
                            <span class="text-secondary font-bold text-xs tracking-[0.3em] mb-6">— REFRÃO —</span>
                            <p class="text-2xl md:text-4xl font-extrabold text-primary">${escapeHtml(refrain)}</p>
                        </div>
                        ${strophesHtml}
                    </div>
                </section>
            `},
            HomilySection: (title, author, content) => `
                <section class="max-w-4xl mx-auto mb-24 px-6">
                    <h1 class="text-5xl md:text-7xl font-black mb-8">${title}</h1>
                    <article class="bg-surface-container-lowest p-8 md:p-20 rounded-[3rem] shadow-sm reading-text">
                        ${content.split('\n').map(p => p.trim() ? `<p class="mb-10 text-xl md:text-2xl">${p}</p>` : '').join('')}
                    </article>
                </section>
            `,
            DailyInfo: (date, color) => `
                <div class="flex flex-col">
                    <span class="text-2xl font-black text-primary tracking-tight">Verbo Diário</span>
                    <div class="flex items-center gap-4 mt-1">
                        <span class="text-xs uppercase tracking-[0.2em] font-bold text-secondary">${date}</span>
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high text-[10px] font-bold uppercase tracking-widest border">
                            <span class="w-2 h-2 rounded-full" style="background-color: ${color}"></span>
                            Cor: ${color}
                        </span>
                    </div>
                </div>
            `
        };

        class App {
            constructor() {
                this.appContent = document.getElementById('appContent');
                this.dailyInfoContainer = document.getElementById('dailyInfoContainer');
                this.scrollIndicator = document.getElementById('scrollIndicator');
                this.header = document.getElementById('mainHeader');
                this.dateBanner = document.getElementById('dateBanner');
                this.currentDateStr = null; // null means 'today'
                this.init();
            }

            async init() {
                if (localStorage.getItem(THEME_KEY) === 'dark') {
                    document.body.classList.add('dark');
                }
                applyTheme();
                window.addEventListener('scroll', () => this.handleScroll());
                appInstance = this;
                await this.loadDate(null);
            }

            async loadDate(dateStr) {
                // dateStr formats expected as "YYYY-MM-DD"
                this.currentDateStr = dateStr;
                
                // Show Banner if not today
                const todayStr = new Date().toLocaleDateString('en-CA');
                if (dateStr && dateStr !== todayStr) {
                    this.dateBanner.classList.remove('hidden');
                } else {
                    this.dateBanner.classList.add('hidden');
                    this.currentDateStr = null; // Treat 'today' date as null to use default endpoint
                }

                // Show loaders
                this.appContent.innerHTML = `
                    <div class="max-w-4xl mx-auto px-6 space-y-20">
                        <div class="h-40 bg-gray-100 animate-pulse rounded-[3rem]"></div>
                        <div class="h-96 bg-gray-100 animate-pulse rounded-[3rem]"></div>
                    </div>
                `;
                
                // Fetch
                await this.fetchData();
            }

            async fetchData() {
                let url = 'https://liturgia.up.railway.app/';
                if (this.currentDateStr) {
                    const [year, month, day] = this.currentDateStr.split('-');
                    url += `${day}-${month}-${year}`; // API exige DD-MM-YYYY
                }

                let data;
                try {
                    // Timeout evita esqueleto de carregamento infinito se a API travar
                    const controller = new AbortController();
                    const timer = setTimeout(() => controller.abort(), 8000);
                    let res;
                    try {
                        res = await fetch(url, { signal: controller.signal });
                    } finally {
                        clearTimeout(timer);
                    }

                    if (!res.ok) throw new Error('A API respondeu com status ' + res.status);

                    data = await res.json();
                    if (!data || typeof data !== 'object') throw new Error('Resposta da API em formato inesperado.');
                } catch (e) {
                    console.error('Fetch Error:', e);
                    // Nunca inventar leituras: mostrar erro honesto com opção de tentar de novo
                    this.renderError(e);
                    return;
                }

                try {
                    this.render(data);
                } catch (err) {
                    console.error('Render Error:', err);
                    this.renderError(err);
                }
            }

            renderError(error) {
                const isAbort = error && error.name === 'AbortError';
                const detalhe = isAbort
                    ? 'A conexão demorou demais para responder.'
                    : 'Não foi possível falar com o servidor da liturgia.';
                const diaLabel = this.currentDateStr
                    ? this.currentDateStr.split('-').reverse().join('/')
                    : 'de hoje';

                this.dailyInfoContainer.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-xl md:text-2xl font-black text-primary tracking-tight">Verbo Diário</span>
                        <span class="text-[10px] md:text-xs uppercase tracking-[0.2em] font-bold text-secondary">Sem conexão</span>
                    </div>
                `;

                this.appContent.innerHTML = `
                    <section class="max-w-2xl mx-auto px-6 text-center" role="alert">
                        <div class="bg-surface-container-lowest rounded-3xl p-10 md:p-16 shadow-sm">
                            <span class="material-symbols-outlined text-5xl text-secondary mb-6 block">cloud_off</span>
                            <h2 class="text-3xl md:text-4xl font-black mb-4">Não foi possível carregar a liturgia ${escapeHtml(diaLabel)}</h2>
                            <p class="text-base md:text-lg text-secondary mb-10">${escapeHtml(detalhe)} Verifique sua conexão e tente novamente.</p>
                            <button onclick="retryLoad()" class="btn-primary inline-flex items-center gap-2 hover:opacity-80 transition-all">
                                <span class="material-symbols-outlined">refresh</span>
                                Tentar novamente
                            </button>
                        </div>
                    </section>
                `;
            }

            handleScroll() {
                const winScroll = document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                this.scrollIndicator.style.height = (winScroll / height * 100) + "%";
            }

            render(data) {
                this.dailyInfoContainer.innerHTML = Components.DailyInfo(data.data || "Hoje", data.cor || "Verde");
                let html = '';
                if (data.primeiraLeitura && typeof data.primeiraLeitura === 'object') {
                    html += Components.ReadingCard("1ª Leitura", data.primeiraLeitura.referencia, data.primeiraLeitura.texto, "reading-1");
                }
                if (data.segundaLeitura && typeof data.segundaLeitura === 'object') {
                    html += Components.ReadingCard("2ª Leitura", data.segundaLeitura.referencia, data.segundaLeitura.texto, "reading-2");
                }
                if (data.salmo && typeof data.salmo === 'object') {
                    html += Components.PsalmSection(data.salmo.referencia, data.salmo.refrao, data.salmo.texto);
                }
                if (data.evangelho && typeof data.evangelho === 'object') {
                    html += Components.ReadingCard("Evangelho", data.evangelho.referencia, data.evangelho.texto, "gospel");
                }
                if (!this.currentDateStr) {
                     html += Components.HomilySection("Reflexão", "Padre Antônio", "O silêncio é a voz de Deus.");
                }
                this.appContent.innerHTML = html;

                // Mantém tamanho de fonte e tema atuais após re-render
                applyFont();
            }
        }

        window.onload = () => new App();
    </script>
</body>
</html>
