name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        run: |
          set -e
          test -f README.md && echo "README OK"
          test -f index.html && echo "HTML OK"
          test -f LICENSE && echo "LICENSE OK"

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Testes de renderização (Node)
        run: node --test tests/parsing.test.js

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install --quiet -r requirements.txt

      - name: Testes estruturais (pytest)
        run: pytest -q
