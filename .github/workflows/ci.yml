name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar arquivos essenciais
        run: |
          test -f README.md && echo "README OK"
          test -f index.html && echo "HTML OK"
          test -f LICENSE && echo "LICENSE OK"
      - name: Testes
        run: |
          python -m pip install pytest --quiet
          pytest -q